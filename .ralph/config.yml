# .ralph/config.yml — the per-project seam for the Ralph-loop pipeline.
#
# THIS FILE is the ONLY thing that changes when you port the pipeline to another
# project. The universal skills (/ralph-prep, /ralph-review, /ralph-ship) and the
# grill⇄BA self-play read these keys; they never hardcode anything project-specific.
#
# Design: docs/plans/2026-06-24-ralph-loop-pipeline.md

# How to fetch the "future" layer (the task) and close issues when shipped.
#   gh  → GitHub Issues via the gh CLI (see docs/agents/issue-tracker.md)
#   prod project will set this to a Jira adapter.
tracker: gh

# How the present / past abstractions resolve to real sources on disk.
# These are globs / paths the BA + grill agents READ. No folders are created.
knowledge:
  # Current state of the project.
  present:
    - CONTEXT.md
    - docs/adr/**
    - <codebase> # the working tree itself
  # Institutional memory — so the BA never re-proposes a rejected/fixed thing.
  # Prod adds: fetched .md from Jira/Confluence/Miro/Slack (see fetcher, deferred).
  past:
    - docs/plans/**
    - docs/superpowers/plans/**
    - 'gh issue list --state closed' # closed issues
    - 'git log' # shipped history

# Per-task BLOCKING validation, run by Ralphex inside the loop.
# Mechanical gate — a task is not "done" until this is green.
# NOTE: react-doctor is HARD-BLOCKING. Any doctor findings feed an additional
# fix-work pass; a task with open doctor findings is not done even if the command
# happens to exit 0 (triage findings, do not just trust the exit code).
validation: npm run lint && npm run format:check && npm run build && npm run doctor --workspace=apps/web

# How to ship once the human has merged to main (gate #2).
# Invokes the existing project deploy command: push main → CI → SSH-verify.
ship: /deploy

# ── Universal tunables (sane defaults; rarely change per project) ───────────
settings:
  branch_prefix: ralph/issue- # working branch = <prefix><N>, the shared state key
  grill_max_rounds: 15 # hard cap on grill⇄BA rounds
  review_block_severity: [high, critical] # fix loop blocks on these; med/low advisory
  gates: # B-mode now. Set both false for A-mode.
    plan_approval: true # gate #1 — human approves the plan
    ship_approval: true # gate #2 — human merges to main
