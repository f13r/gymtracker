name: AI Deploy (data resync)

# Manual-only. DESTRUCTIVE: overwrites the prod DB from apps/api/db/prod-snapshot.sql.
# A headless Claude Code agent reads DEPLOY.md and performs the restore on the self-hosted
# runner (user f13r). Routine code deploys stay on deploy.yml (push to main) — this never
# fires on push, so a normal deploy can't wipe prod data.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESTORE to confirm overwriting the prod DB from the committed snapshot'
        required: true
        default: ''

concurrency:
  group: gymtracker-deploy
  cancel-in-progress: false

jobs:
  ai-deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      HOME: /home/f13r
      PATH: /home/f13r/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Confirm destructive intent
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "RESTORE" ]; then
            echo "::error::Confirmation mismatch — you must type exactly RESTORE. Aborting before any DB change."
            exit 1
          fi

      - name: Sync prod checkout to latest main
        run: |
          set -euo pipefail
          cd /var/www/gymtracker
          git fetch origin main
          git reset --hard origin/main
          echo "Prod checkout now at: $(git rev-parse --short HEAD)"

      - name: AI-driven data-restore deploy
        run: |
          set -euo pipefail
          cd /var/www/gymtracker
          test -f .github/ai-deploy-prompt.md
          claude -p "$(cat .github/ai-deploy-prompt.md)" \
            --dangerously-skip-permissions \
            --output-format text \
            | tee /tmp/ai-deploy.log
          echo "---- AI deploy finished ----"
