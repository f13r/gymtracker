name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -e
          cd /var/www/gymtracker
          git pull origin main
          npm ci
          npm run build --workspace=packages/shared
          npm run build --workspace=apps/api
          npm run build --workspace=apps/web
          npm run db:migrate
          pm2 reload ecosystem.config.js --env production
